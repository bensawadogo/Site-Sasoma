# ════════════════════════════════════════════════════════════════════════════
#  Nginx — reverse proxy de production pour PETROVOLL (VPS Linux)
# ════════════════════════════════════════════════════════════════════════════
#  Emplacement conseillé : /etc/nginx/sites-available/petrovoll.conf
#  Activation            : ln -s /etc/nginx/sites-available/petrovoll.conf \
#                                 /etc/nginx/sites-enabled/
#  Test / recharge       : nginx -t && systemctl reload nginx
#
#  ⚠️  Remplacer TOUS les placeholders avant mise en ligne :
#        petrovoll.example       → nom de domaine réel
#        /var/www/petrovoll      → chemin réel sur le VPS
#
#  TODO [infra] :
#   - [ ] Certificat TLS via certbot (décommenter le bloc 443 après obtention)
#   - [ ] Redirection HTTP → HTTPS définitive une fois le TLS en place
#   - [ ] rate-limiting (limit_req_zone) sur /api/contact et /api/auth
#   - [ ] Bannière HSTS après validation complète du HTTPS
#   - [ ] Sonde /api/health pour le monitoring (Uptime Kuma, Netdata…)
# ════════════════════════════════════════════════════════════════════════════

# Cache des assets immuables de Next.js
proxy_cache_path /var/cache/nginx/petrovoll levels=1:2 keys_zone=petrovoll_cache:10m max_size=1g inactive=60m;
limit_req_zone $binary_remote_addr zone=petrovoll_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name petrovoll.example www.petrovoll.example;

    # ── Sécurité de base ─────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Uploads (médias Payload / images produits) ───────────────────────────
    # Doit être cohérent avec la limite définie côté Payload (TODO [media]).
    client_max_body_size 12m;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml font/woff2;

    # ── Assets Next.js : immuables, cache long ──────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache petrovoll_cache;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Médias locaux (si Payload écrit sur disque ; sinon Cloudinary) ──────
    location /media/ {
        alias /var/www/petrovoll/public/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── Modèles 3D / vidéos : gros fichiers statiques ───────────────────────
    location ~* \.(glb|gltf|hdr|mp4|webm)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Endpoints sensibles : limitation de débit ───────────────────────────
    location ~ ^/(api/contact|api/auth|admin) {
        limit_req zone=petrovoll_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
    }

    # ── Reste de l'application ──────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # HMR / WebSocket
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # TODO [nginx] : `include proxy_params;` suppose le fichier standard Debian/Ubuntu.
    # Le recopier ou remplacer par les en-têtes explicites ci-dessus.

    # ── HTTPS (à décommenter après `certbot --nginx`) ───────────────────────
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/petrovoll.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/petrovoll.example/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

