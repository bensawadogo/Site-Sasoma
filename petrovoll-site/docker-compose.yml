# ════════════════════════════════════════════════════════════════════════════
#  docker-compose.yml — environnement de développement local PETROVOLL
# ════════════════════════════════════════════════════════════════════════════
#  Contenu : Next.js (site public + routes API) + PostgreSQL + Adminer (outils).
#
#  ⚠️  IMPORTANT — OÙ EST PAYLOAD CMS ?
#  Payload v3 n'est PAS un service séparé : il est EMBARQUÉ dans l'application
#  Next.js (monté sous /admin via `withPayload`). Il n'y a donc pas de conteneur
#  Payload à part — son "panel" est servi par le conteneur `web`, et il utilise
#  la MÊME base PostgreSQL (variables DATABASE_URI / PAYLOAD_SECRET du fichier
#  .env.local monté ci-dessous).
#  Ce choix est volontaire : un seul runtime, une seule base, un seul déploiement.
#
#  Démarrage :
#    docker compose up -d            # db + web (build de l'image locale)
#    docker compose --profile tools up -d   # + Adminer (http://localhost:8080)
#    docker compose down             # arrêt
#    docker compose down -v          # arrêt + suppression des volumes (⚠️ données)
# ════════════════════════════════════════════════════════════════════════════

name: petrovoll

services:
  # ── Base de données ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: petrovoll-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petrovoll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petrovoll}
      POSTGRES_DB: ${POSTGRES_DB:-petrovoll}
      # Encodage adapté aux libellés en français
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Exposé en local pour Prisma Studio / psql — à retirer en production
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-petrovoll} -d ${POSTGRES_DB:-petrovoll}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - petrovoll

  # ── Application Next.js (site public + API + admin Payload) ───────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: petrovoll-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Le fichier .env.local doit exister : cp .env.local.example .env.local
      - .env.local
    environment:
      # On écrase l'hôte : dans le réseau Docker la base est « db », pas « localhost »
      DATABASE_URL: postgresql://${POSTGRES_USER:-petrovoll}:${POSTGRES_PASSWORD:-petrovoll}@db:5432/${POSTGRES_DB:-petrovoll}?schema=public
      DATABASE_URI: postgresql://${POSTGRES_USER:-petrovoll}:${POSTGRES_PASSWORD:-petrovoll}@db:5432/${POSTGRES_DB:-petrovoll}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    volumes:
      # Persistance des médias uploadés par Payload en mode stockage local
      - media:/app/public/media
    healthcheck:
      # TODO [docker] : créer app/api/health/route.ts (simple `{ ok: true }`)
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - petrovoll

  # ── Outils (profil optionnel) ─────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: petrovoll-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
    profiles:
      # Démarrer avec : docker compose --profile tools up -d
      - tools
    networks:
      - petrovoll

  # TODO [docker] : service one-shot de migrations Payload (Next.js 15)
  #   migrate:
  #     build: { context: ., target: builder }
  #     command: npm run payload migrate
  #     depends_on: { db: { condition: service_healthy } }
  #     env_file: [.env.local]

volumes:
  pgdata:
    name: petrovoll-pgdata
  media:
    name: petrovoll-media

networks:
  petrovoll:
    name: petrovoll-network
    driver: bridge