<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petrovöll Burkina — Lubrifiants allemands</title>
<meta name="description" content="Petrovöll, lubrifiants haute performance conçus en Allemagne depuis 1999. Représentant officiel au Burkina Faso.">
<style>
  :root { --bg:#0E0E0D; --oil:#F6C66A; --txt:#F1EFE8; }
  * { box-sizing:border-box; margin:0; }
  html, body { background:var(--bg); color:var(--txt); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hero { height:250svh; position:relative; }
  @media (orientation:landscape) { .hero { height:300svh; } }
  .stage { position:sticky; top:0; height:100svh; overflow:hidden; }
  .stage canvas, .stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #p1 { opacity:0; }
  .shade { position:absolute; left:0; right:0; bottom:0; height:55%; background:linear-gradient(transparent, rgba(0,0,0,.85)); pointer-events:none; }
  .txt { position:absolute; left:6%; right:6%; bottom:max(8svh, env(safe-area-inset-bottom)); }
  .k { font-size:12px; letter-spacing:.14em; color:var(--oil); margin-bottom:8px; }
  .t { font-size:clamp(30px, 9vw, 72px); font-weight:900; line-height:.95; text-transform:uppercase; }
  .cta { display:inline-block; margin-top:16px; padding:14px 20px; min-height:44px; border:1px solid var(--oil); color:var(--oil); text-decoration:none; font-weight:700; opacity:0; transition:opacity .3s; pointer-events:none; }
  .cta.on { opacity:1; pointer-events:auto; }
  .hud { position:fixed; top:6px; right:6px; font:11px monospace; background:#000a; padding:3px 6px; border-radius:4px; z-index:9; display:none; }
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="stage">
    <img id="p0" alt="Bidon Petrovöll prêt à verser l'huile dans un moteur" decoding="async">
    <img id="p1" alt="" decoding="async">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="shade"></div>
    <div class="txt">
      <div class="k" id="k"></div>
      <div class="t" id="t"></div>
      <a class="cta" id="cta" href="https://wa.me/226XXXXXXXX">Trouver un revendeur</a>
    </div>
  </div>
</section>
<div style="height:60svh"></div>
<div class="hud" id="hud"></div>

<script>
/* ====== CONFIGURATION — la SEULE partie modifiable ====== */
const CFG = {
  A: { from: 0.00, to: 0.55 },   // séquence A : vraie vidéo (bidon à gauche → versement)
  B: { from: 0.55, to: 0.92 },   // séquence B : vidéo IA (intérieur du moteur lubrifié)
  width: { m: { standard: 540, full: 1080 }, d: { standard: 960, full: 1920 } },
  texts: [
    [0.00, "PETROVÖLL · ALLEMAGNE · DEPUIS 1999", "La protection commence ici."],
    [0.15, "L'HUILE",         "Chaque goutte compte."],
    [0.35, "LE VERSEMENT",    "Directement au cœur."],
    [0.55, "LE MOTEUR",       "Elle va là où le moteur en a besoin."],
    [0.92, "[PRODUIT PHARE]", "Ingénierie allemande."]
  ]
};
/* ====== FIN DE LA CONFIGURATION — ne rien modifier en dessous ====== */

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hero = $('hero'), cv = $('cv'), ctx = cv.getContext('2d');
const Q = new URLSearchParams(location.search);
const O = matchMedia('(orientation: portrait)').matches ? 'm' : 'd';

function pickTier() {
  const forced = Q.get('tier');
  if (forced) return forced;
  const c = navigator.connection || {};
  const mem = navigator.deviceMemory;
  if (c.saveData || /(^|-)2g|3g/.test(c.effectiveType || '') || (mem && mem <= 2) ||
      matchMedia('(prefers-reduced-motion: reduce)').matches) return 'lite';
  if (mem && mem >= 6) return 'full';
  return 'standard';
}
let TIER = pickTier();

// Posters : toujours chargés (palier lite + affichage immédiat)
$('p0').src = `public/poster-start-${O}.webp`;
$('p1').src = `public/poster-end-${O}.webp`;

const seq = { A: [], B: [] };
let dirty = true, lastKey = '', lastText = -1;

function loadSeq(name) {
  const W = CFG.width[O][TIER] || CFG.width[O].standard;
  const base = `public/seq/${name}/${O}/${W}/`;
  return fetch(base + 'manifest.json').then(r => r.json()).then(man => {
    const n = man.count, arr = new Array(n), order = [], seen = new Set();
    for (let i = 0; i < n; i += 4) { order.push(i); seen.add(i); }
    for (let i = 0; i < n; i++) if (!seen.has(i)) order.push(i);
    let k = 0;
    const next = () => {
      if (k >= order.length) return;
      const i = order[k++], im = new Image();
      im.decoding = 'async';
      im.onload = () => { arr[i] = im; dirty = true; next(); };
      im.onerror = next;
      im.src = base + String(i + 1).padStart(3, '0') + '.webp';
    };
    for (let j = 0; j < 4; j++) next();
    seq[name] = arr;
  }).catch(() => { seq[name] = []; });
}

function nearest(arr, i) {
  for (let d = 0; d < arr.length; d++) {
    if (arr[i - d]) return arr[i - d];
    if (arr[i + d]) return arr[i + d];
  }
  return null;
}

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, TIER === 'full' ? 2 : 1.5);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  dirty = true;
}

function cover(im) {
  const cw = cv.width, ch = cv.height, iw = im.naturalWidth, ih = im.naturalHeight;
  const s = Math.max(cw / iw, ch / ih), w = iw * s, h = ih * s;
  ctx.drawImage(im, (cw - w) / 2, (ch - h) / 2, w, h);
}

function progress() {
  const r = hero.getBoundingClientRect();
  return clamp(-r.top / (r.height - innerHeight), 0, 1);
}

function frameFor(p) {
  const A = seq.A, B = seq.B;
  if (p < CFG.B.from || !B.length) {
    if (!A.length) return null;
    const t = clamp((p - CFG.A.from) / (CFG.A.to - CFG.A.from), 0, 1);
    return nearest(A, Math.round(t * (A.length - 1)));
  }
  const t = clamp((p - CFG.B.from) / (CFG.B.to - CFG.B.from), 0, 1);
  return nearest(B, Math.round(t * (B.length - 1)));
}

function render() {
  const p = progress();
  const ti = CFG.texts.reduce((a, x, i) => (p >= x[0] ? i : a), 0);
  if (ti !== lastText) {
    lastText = ti;
    $('k').textContent = CFG.texts[ti][1];
    $('t').textContent = CFG.texts[ti][2];
  }
  $('cta').classList.toggle('on', p >= 0.92);

  if (TIER === 'lite') {
    cv.style.display = 'none';
    $('p1').style.opacity = clamp((p - CFG.B.from) / (CFG.B.to - CFG.B.from), 0, 1);
  } else {
    const im = frameFor(p);
    const key = p.toFixed(4) + (im ? im.src : '');
    if (im && (dirty || key !== lastKey)) {
      cover(im);
      lastKey = key;
      dirty = false;
      $('p0').style.opacity = 0;
    }
  }
  if (Q.has('debug')) {
    $('hud').style.display = 'block';
    $('hud').textContent = `p=${p.toFixed(2)} ${TIER} ${O} A:${seq.A.filter(Boolean).length} B:${seq.B.filter(Boolean).length}`;
  }
}

// Garde-fou : si le scroll tourne sous 24 images/s pendant 2 s → palier lite
let probing = false;
function probe() {
  if (probing || TIER === 'lite') return;
  probing = true;
  let n = 0;
  const t0 = performance.now();
  const loop = t => {
    n++;
    if (t - t0 < 2000) return requestAnimationFrame(loop);
    if (n < 48) { TIER = 'lite'; render(); }
  };
  requestAnimationFrame(loop);
}

let raf = 0;
addEventListener('scroll', () => {
  probe();
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
}, { passive: true });
addEventListener('resize', () => { resize(); render(); });

resize();
render();
if (TIER !== 'lite') {
  loadSeq('A').then(() => { render(); return loadSeq('B'); }).then(render);
  (function tick() { if (dirty) render(); requestAnimationFrame(tick); })();
}
</script>
</body>
</html>
